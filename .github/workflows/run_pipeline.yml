name: AI News Pipeline

on:
  schedule:
    - cron: '0 8 * * *'  # 3am EST (8am UTC) daily
  workflow_dispatch:       # Manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to push to gh-pages branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agents.orchestrator_agent

      - name: Create index.html redirect to latest report
        run: |
          FILENAME=$(ls newsreports/*.html | sort | tail -1 | xargs basename)
          echo "<meta http-equiv='refresh' content='0; url=$FILENAME'>" > newsreports/index.html

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newsreports
          keep_files: true  # Keeps previous reports, doesn't wipe the branch